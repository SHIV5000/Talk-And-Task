name: Comprehensive Quality Check

on:
  push:
    branches: [ main, master, develop ]   # adjust as needed
  pull_request:
    branches: [ main, master ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          # Tools required by check-quality.js
          npm install --save-dev linkinator stylelint stylelint-declaration-strict-value eslint eslint-plugin-i18next

      - name: Build React app
        run: npm run build

      - name: Run quality checks
        run: node check-quality.js

      - name: Check for issues
        id: check_issues
        run: |
          if grep -q '❌' quality-report.txt; then
            echo "fail=true" >> $GITHUB_OUTPUT
          else
            echo "fail=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: quality-report.txt

      - name: Fail workflow if issues found
        if: steps.check_issues.outputs.fail == 'true'
        run: exit 1
